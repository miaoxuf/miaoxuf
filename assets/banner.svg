<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="1" stop-color="#0f1c38"/>
    </linearGradient>
    <linearGradient id="maize" x1="0" x2="1">
      <stop offset="0" stop-color="#ffcb05"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="link" x1="0" x2="1">
      <stop offset="0" stop-color="#2f4a85"/>
      <stop offset="1" stop-color="#3d63b0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1a2846" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.7"/>

    <!-- scanning line -->
    <rect x="0" y="0" width="1200" height="2" fill="#ffcb05" opacity="0.12">
      <animate attributeName="y" values="0;320;0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- ================= ROBOT ARM ================= -->
    <!-- reachable workspace -->
    <path d="M14 270 A206 206 0 0 1 426 270" fill="none" stroke="#3b82f6" stroke-opacity="0.35"
          stroke-width="1.5" stroke-dasharray="4 7">
      <animate attributeName="stroke-dashoffset" values="0;-110" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M84 270 A136 136 0 0 1 356 270" fill="none" stroke="#3b82f6" stroke-opacity="0.18"
          stroke-width="1" stroke-dasharray="2 6"/>

    <!-- ground -->
    <line x1="40" y1="282" x2="400" y2="282" stroke="#2a3b63" stroke-width="2"/>
    <g stroke="#2a3b63" stroke-width="1.5">
      <line x1="60" y1="282" x2="50" y2="294"/><line x1="100" y1="282" x2="90" y2="294"/>
      <line x1="140" y1="282" x2="130" y2="294"/><line x1="180" y1="282" x2="170" y2="294"/>
      <line x1="260" y1="282" x2="250" y2="294"/><line x1="300" y1="282" x2="290" y2="294"/>
      <line x1="340" y1="282" x2="330" y2="294"/><line x1="380" y1="282" x2="370" y2="294"/>
    </g>

    <!-- base -->
    <rect x="186" y="262" width="68" height="20" rx="4" fill="#1c2c52" stroke="#3d63b0" stroke-width="1.5"/>

    <!-- joint 1 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-20 220 262; 22 220 262; -20 220 262" keyTimes="0;0.5;1"
        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="7s" repeatCount="indefinite"/>
      <line x1="220" y1="262" x2="220" y2="158" stroke="#34558f" stroke-width="18" stroke-linecap="round"/>
      <line x1="214" y1="252" x2="214" y2="168" stroke="#5f86d6" stroke-opacity="0.5" stroke-width="2"/>

      <!-- joint 2 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-25 220 158; 10 220 158; -25 220 158" keyTimes="0;0.5;1"
          calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="5.3s" repeatCount="indefinite"/>
        <line x1="220" y1="158" x2="330" y2="158" stroke="#34558f" stroke-width="14" stroke-linecap="round"/>
        <line x1="230" y1="153" x2="320" y2="153" stroke="#5f86d6" stroke-opacity="0.5" stroke-width="2"/>

        <!-- joint 3 / wrist -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="10 330 158; -30 330 158; 10 330 158" keyTimes="0;0.5;1"
            calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4.1s" repeatCount="indefinite"/>
          <line x1="330" y1="158" x2="372" y2="158" stroke="#34558f" stroke-width="10" stroke-linecap="round"/>
          <!-- gripper -->
          <g stroke="#ffcb05" stroke-width="4" stroke-linecap="round" fill="none">
            <path d="M374 150 L388 150 L394 146">
              <animate attributeName="d" values="M374 150 L388 150 L394 146;M374 154 L388 154 L394 152;M374 150 L388 150 L394 146" dur="2.2s" repeatCount="indefinite"/>
            </path>
            <path d="M374 166 L388 166 L394 170">
              <animate attributeName="d" values="M374 166 L388 166 L394 170;M374 162 L388 162 L394 164;M374 166 L388 166 L394 170" dur="2.2s" repeatCount="indefinite"/>
            </path>
          </g>
          <circle cx="396" cy="158" r="4" fill="#ffcb05" filter="url(#glow)">
            <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
          </circle>
          <circle cx="330" cy="158" r="7" fill="#0f1c38" stroke="#ffcb05" stroke-width="2.5"/>
        </g>
        <circle cx="220" cy="158" r="9" fill="#0f1c38" stroke="#ffcb05" stroke-width="2.5"/>
      </g>
    </g>
    <circle cx="220" cy="262" r="11" fill="#0f1c38" stroke="#ffcb05" stroke-width="3"/>
    <circle cx="220" cy="262" r="3" fill="#ffcb05"/>

    <!-- divider -->
    <line x1="455" y1="50" x2="455" y2="270" stroke="#22345c" stroke-width="1.5"/>

    <!-- ================= TEXT ================= -->
    <text x="490" y="86" class="mono" font-size="16" fill="#ffcb05">$ roslaunch miaoxu hello.launch</text>
    <rect x="796" y="72" width="9" height="18" fill="#ffcb05">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="488" y="152" font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="1">Miaoxu Fang</text>
    <rect x="490" y="168" height="4" rx="2" fill="url(#maize)" width="0">
      <animate attributeName="width" values="0;150;150;0" keyTimes="0;0.2;0.85;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <text x="490" y="208" font-size="22" fill="#a9bbdc">Robot Control &amp; Planning · LLM-driven Algorithm Design</text>
    <text x="490" y="242" font-size="16" fill="#7d8aa5">M.S. Robotics @ University of Michigan  ·  Toward a Ph.D. in Smart Manufacturing</text>

    <!-- ================= STEP RESPONSE ================= -->
    <g transform="translate(0,0)">
      <text x="960" y="272" class="mono" font-size="11" fill="#55678c">step response · ζ=0.4</text>
      <line x1="960" y1="300" x2="1160" y2="300" stroke="#2a3b63" stroke-width="1.2"/>
      <line x1="960" y1="300" x2="960" y2="278" stroke="#2a3b63" stroke-width="1.2"/>
      <line x1="960" y1="284" x2="1160" y2="284" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3 4"/>
      <path d="M960 300 C 978 300, 982 273, 998 276 S 1018 290, 1032 286 S 1052 282, 1066 284.5 S 1090 284, 1160 284"
            fill="none" stroke="#ffcb05" stroke-width="2" stroke-dasharray="260" stroke-dashoffset="260">
        <animate attributeName="stroke-dashoffset" values="260;0;0;260" keyTimes="0;0.45;0.9;1" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#22345c" stroke-width="1.5"/>
</svg>
